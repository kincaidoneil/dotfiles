name: Test Install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Remove pre-installed Node
        run: |
          # macOS
          sudo rm -f /opt/homebrew/bin/node
          sudo rm -f /opt/homebrew/bin/npm
          sudo rm -f /opt/homebrew/bin/npx
          # Linux
          sudo rm -f /usr/local/bin/n
          sudo rm -f /usr/local/bin/node
          sudo rm -f /usr/local/bin/npm
          sudo rm -f /usr/local/bin/npx

      - name: Run install script
        run: bash install.sh

      - name: Verify installations
        shell: zsh {0}
        run: |
          # Load what a new shell loads. No errexit: it would also fire inside
          # the prompt's hooks and end the step without saying why.
          source ~/.zshrc
          fail() { echo "FAIL: $1"; exit 1; }

          # Check dotfiles are symlinked
          test -L ~/.zshrc || fail "~/.zshrc is not a symlink"
          test -L ~/.gitconfig || fail "~/.gitconfig is not a symlink"

          # Check zi loaded, and key commands exist
          (( $+functions[zi] )) || fail "zi did not load"
          for cmd in brew node cargo zsh portless; do
            command -v $cmd || fail "$cmd is not on PATH"
          done
